<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase B: hand-tracking conducting trace test</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; margin: 0; padding: 16px; }
  #controls { margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
  #controls label { margin-right: 12px; }
  #controls input { width: 60px; }
  #status { margin: 8px 0; color: #9cf; max-width: 640px; }
  button { font-size: 14px; padding: 6px 14px; }

  /* Single container: camera feed + skeleton + live trace + reference
     pattern are all drawn into one canvas (feedback 2026-07-29: "only 1
     container with the three functions"); the real reference photo is an
     absolutely-positioned inset thumbnail inside the SAME wrapper, not a
     separate layout column. */
  #stage { position: relative; width: 640px; height: 480px; }
  #mainCanvas { background: #1a1a1a; border: 1px solid #333; }
  #refThumb { position: absolute; top: 8px; right: 8px; width: 120px; background: #fff;
    border-radius: 4px; padding: 2px; }
  #refThumb.unavailable { display: none; }
</style>
</head>
<body>
<h3>Phase B: hand-tracking position test (fingers-together centroid, not index-point)</h3>
<div id="controls">
  <label>BPM <input id="bpm" type="number" value="80"></label>
  <label>Signature
    <select id="signature">
      <option value="2">2/4</option>
      <option value="3">3/4</option>
      <option value="4">4/4</option>
    </select>
  </label>
  <label>Seconds <input id="seconds" type="number" value="60"></label>
  <label>Scale (px/unit) <input id="scale" type="number" value="150"></label>
  <button id="startBtn">Calibrate &amp; Start</button>
</div>
<div id="status">Idle. Click "Calibrate &amp; Start", allow camera access, then hold your hand with fingers
  together (like pinching a baton) at the TOP/prep position when asked.</div>
<div id="stage">
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <canvas id="mainCanvas" width="640" height="480"></canvas>
  <img id="refThumb" class="unavailable" src="assets/reference_2_4.png" alt="real conducting reference diagram">
</div>

<script type="module">
// @mediapipe/hands (the legacy CDN package, matching the version string in
// the user's original reference) is deprecated -- last published ~3 years
// ago, confirmed via web search 2026-07-29 before building on it, the same
// class of dead-API problem hit with Python's mediapipe 1.0 earlier this
// session. Using the actively-maintained replacement instead:
// @mediapipe/tasks-vision's HandLandmarker (latest published 2026-04-27
// per npm at time of writing).
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// Pinned to specific versions rather than @latest -- matches the working
// config in a live reference project (github.com/ericwei97-cloud/gesture-synth,
// checked 2026-07-29), and is safer against a future breaking release
// silently changing behavior underneath this page.
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

// Standard 21-landmark hand topology (stable across MediaPipe hand-model
// versions) -- tasks-vision doesn't bundle a drawing-utils equivalent the
// way the legacy package did, so this is hardcoded rather than imported.
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16], [13,17],[17,18],[18,19],[19,20], [0,17],
];

// Canonical reference patterns, ported from src/conducting_patterns.py.
// 2/4 corrected 2026-07-29 from a real conducting-pedagogy diagram: prep
// up-left, down to beat 1 (lowest point), rebound up-right to beat 2.
const REFERENCE = {
  2: [[-0.2, 0.9], [0.0, -1.0], [0.35, -0.3]],
  3: [[0.0, 0.0], [-0.3, -1.0], [0.8, -0.3], [0.0, 0.0]],
  4: [[0.0, 0.0], [0.0, -1.0], [-0.7, -0.4], [0.7, -0.4], [0.0, 0.0]],
};

// Real hand-drawn reference diagrams (user-supplied, 2026-07-29). Only 2/4
// has a verified real diagram so far; 3/4 and 4/4 fall back to the
// programmatic line drawn on the canvas itself.
const REFERENCE_IMAGES = { 2: "assets/reference_2_4.png" };

// Fingertip landmark indices in MediaPipe Hands' 21-point model: thumb,
// index, middle, ring, pinky tips. Averaging these tracks the "point" of
// a fingers-together hand shape (the Italian conducting gesture), not a
// single-finger pointing gesture.
const FINGERTIP_IDX = [4, 8, 12, 16, 20];

let runId = null;
let bpm = 80, signature = 2, seconds = 60, scalePxPerUnit = 150;
let traceXY = [];
let measureIndex = -1;
let measureStartWall = null;
let running = false;
let stopAt = 0;

// Calibration (feedback 2026-07-29: detecting "the top" live turned out
// unreliable -- it fired on every direction change instead of once per
// measure. Simpler and more robust: ask the user to hold still at the
// actual top/prep position for a moment before the run starts, and use
// that single averaged sample as a FIXED origin for the whole run. Trace
// resets (below) are then purely a per-measure clear of the point list --
// they no longer try to re-detect where "the top" is.
const CALIBRATION_HOLD_MS = 1200;
let appState = "idle"; // idle | countdown | calibrating | running
let origin = null; // [logicalX, logicalY], fixed once calibrated
let calibSamples = [];

function currentLogicalXY(landmarks) {
  // Mirror x here (1 - x) so tracked "right" means the user's real right,
  // not the camera's unmirrored right -- matches the Python tool's
  // cv2.flip approach and the mirrored canvas draw below.
  const x = 1.0 - (FINGERTIP_IDX.reduce((s, i) => s + landmarks[i].x, 0) / FINGERTIP_IDX.length);
  const y = FINGERTIP_IDX.reduce((s, i) => s + landmarks[i].y, 0) / FINGERTIP_IDX.length;
  return [x, y];
}

// --- Metronome (Web Audio, lookahead scheduler -- standard pattern for
// sample-accurate timing that setInterval/rAF alone can't provide) ---
let audioCtx = null;
let nextBeatTime = 0;
let beatInMeasure = 0;
let metronomeTimer = null;
const SCHEDULE_AHEAD_S = 0.12;

function beatIntervalS() { return 60 / bpm; }

function scheduleClick(time, isDownbeat) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = isDownbeat ? 1000 : 700;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(0.5, time + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.08);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.09);
}

function onMeasureBoundary() {
  traceXY = [];
  measureIndex += 1;
  measureStartWall = performance.now();
}

function metronomeSchedulerTick() {
  while (nextBeatTime < audioCtx.currentTime + SCHEDULE_AHEAD_S) {
    const isDownbeat = beatInMeasure === 0;
    scheduleClick(nextBeatTime, isDownbeat);
    if (isDownbeat) {
      const delayMs = Math.max(0, (nextBeatTime - audioCtx.currentTime) * 1000);
      setTimeout(onMeasureBoundary, delayMs);
    }
    nextBeatTime += beatIntervalS();
    beatInMeasure = (beatInMeasure + 1) % signature;
  }
}

function startMetronome() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  beatInMeasure = 0;
  nextBeatTime = audioCtx.currentTime + 0.05;
  metronomeSchedulerTick();
  metronomeTimer = setInterval(metronomeSchedulerTick, 25);
}

function stopMetronome() {
  if (metronomeTimer) clearInterval(metronomeTimer);
  metronomeTimer = null;
}

// --- Rendering: everything drawn into one canvas ---
const video = document.getElementById("video");
const mainCanvas = document.getElementById("mainCanvas");
const ctx = mainCanvas.getContext("2d");
const statusEl = document.getElementById("status");
const refThumb = document.getElementById("refThumb");
const signatureSelect = document.getElementById("signature");

function updateReferenceThumb() {
  const sig = parseInt(signatureSelect.value);
  const src = REFERENCE_IMAGES[sig];
  if (src) { refThumb.src = src; refThumb.classList.remove("unavailable"); }
  else { refThumb.classList.add("unavailable"); }
}
signatureSelect.addEventListener("change", updateReferenceThumb);
updateReferenceThumb();

function boundingSize(points) {
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  return Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) || 1.0;
}

function originPx(W, H) {
  return origin ? [origin[0] * W, origin[1] * H] : [W / 2, H / 2];
}

// Reference/trace points are stored in "logical" units: x-right, y-up,
// relative to the calibrated origin. Screen pixels mirror x the same way
// the video draw below does, so both line up over the live camera feed.
function unitToPx(p, W, H) {
  const [ox, oy] = originPx(W, H);
  return [ox + p[0] * scalePxPerUnit, oy - p[1] * scalePxPerUnit];
}

function drawSkeleton(landmarks, W, H) {
  ctx.strokeStyle = "#ffffff55"; ctx.lineWidth = 1;
  HAND_CONNECTIONS.forEach(([a, b]) => {
    ctx.beginPath();
    ctx.moveTo((1 - landmarks[a].x) * W, landmarks[a].y * H);
    ctx.lineTo((1 - landmarks[b].x) * W, landmarks[b].y * H);
    ctx.stroke();
  });
  ctx.fillStyle = "#00ff0088";
  landmarks.forEach(p => { ctx.beginPath(); ctx.arc((1 - p.x) * W, p.y * H, 2, 0, 7); ctx.fill(); });

  const [cx, cy] = currentLogicalXY(landmarks);
  ctx.fillStyle = "#00ff00";
  ctx.beginPath();
  ctx.arc(cx * W, cy * H, 6, 0, 7);
  ctx.fill();
}

function drawOverlay(W, H) {
  const ref = REFERENCE[signature];

  if (origin) {
    ctx.strokeStyle = "#aaaaaa"; ctx.lineWidth = 2;
    ctx.beginPath();
    ref.forEach((p, i) => { const [x, y] = unitToPx(p, W, H); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.stroke();
    ctx.fillStyle = "#aaaaaa";
    ref.forEach(p => { const [x, y] = unitToPx(p, W, H); ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); });

    if (traceXY.length >= 2) {
      ctx.strokeStyle = "#f5f0e0"; ctx.lineWidth = 2;
      ctx.beginPath();
      traceXY.forEach((p, i) => { const [x, y] = unitToPx(p, W, H); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
      ctx.stroke();
    }
  }

  ctx.fillStyle = "#ffffffcc"; ctx.font = "14px sans-serif";
  if (appState === "countdown") {
    ctx.font = "bold 28px sans-serif";
    ctx.fillText("Hold at TOP/prep position...", 20, H / 2);
  } else if (appState === "calibrating") {
    ctx.font = "bold 28px sans-serif";
    ctx.fillText("Calibrating...", 20, H / 2);
  } else if (appState === "running") {
    ctx.fillText(`measure ${measureIndex}  beat ${beatInMeasure + 1}/${signature}`, 10, H - 12);
  }
}

function renderFrame(landmarks) {
  const W = mainCanvas.width, H = mainCanvas.height;
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -W, 0, W, H); // mirrored video draw (selfie view)
  ctx.restore();

  if (landmarks) drawSkeleton(landmarks, W, H);
  drawOverlay(W, H);
}

function logSample(t, found, x, y, nx, ny) {
  fetch("/log", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ run_id: runId, t, measure_index: measureIndex, found, x, y, nx, ny }),
  }).catch(() => {}); // best-effort -- don't let a dropped log request stall tracking
}

function onResults(landmarksList) {
  const landmarks = landmarksList && landmarksList.length > 0 ? landmarksList[0] : null;
  const now = performance.now();
  let found = false, x = null, y = null, nx = null, ny = null;

  if (landmarks) {
    found = true;
    [x, y] = currentLogicalXY(landmarks);

    if (appState === "calibrating") {
      calibSamples.push([x, y]);
    } else if (appState === "running" && origin) {
      nx = x - origin[0];
      ny = -(y - origin[1]); // image y-down -> logical y-up
      traceXY.push([nx, ny]);
    }
  }

  renderFrame(landmarks);
  if (appState === "running") logSample(now / 1000, found, x, y, nx, ny);
}

async function saveSnapshot() {
  const dataUrl = mainCanvas.toDataURL("image/png");
  await fetch("/snapshot", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ run_id: runId, image: dataUrl }),
  }).catch(() => {});
}

function stopRun() {
  running = false;
  appState = "idle";
  stopMetronome();
  statusEl.textContent = `Done. Log + snapshot saved server-side under logs/ (run ${runId}).`;
  saveSnapshot();
}

let handLandmarker = null;
let lastVideoTime = -1;

function detectLoop() {
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = handLandmarker.detectForVideo(video, performance.now());
    onResults(result.landmarks);
  }
  if (appState !== "idle" && (!running || performance.now() < stopAt)) {
    requestAnimationFrame(detectLoop);
  } else if (running) {
    stopRun();
  }
}

async function ensureModelAndCamera() {
  if (!handLandmarker) {
    const vision = await FilesetResolver.forVisionTasks(WASM_URL);
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: 1,
    });
  }
  if (!video.srcObject) {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await new Promise(resolve => { video.onloadedmetadata = resolve; });
    video.play();
  }
}

async function start() {
  bpm = parseFloat(document.getElementById("bpm").value);
  signature = parseInt(document.getElementById("signature").value);
  seconds = parseFloat(document.getElementById("seconds").value);
  scalePxPerUnit = parseFloat(document.getElementById("scale").value) || 150;

  statusEl.textContent = "Loading model...";
  appState = "countdown";
  requestAnimationFrame(detectLoop); // drives rendering + detection through calibration too
  await ensureModelAndCamera();

  statusEl.textContent = "Hold your hand at the TOP/prep position and stay still...";
  await new Promise(r => setTimeout(r, CALIBRATION_HOLD_MS));

  appState = "calibrating";
  calibSamples = [];
  statusEl.textContent = "Calibrating origin...";
  await new Promise(r => setTimeout(r, CALIBRATION_HOLD_MS));

  if (calibSamples.length === 0) {
    statusEl.textContent = "Calibration failed: no hand detected. Click the button to try again.";
    appState = "idle";
    return;
  }
  const ox = calibSamples.reduce((s, p) => s + p[0], 0) / calibSamples.length;
  const oy = calibSamples.reduce((s, p) => s + p[1], 0) / calibSamples.length;
  origin = [ox, oy];

  traceXY = []; measureIndex = -1;
  runId = new Date().toISOString().replace(/[:.]/g, "-");
  running = true;
  appState = "running";
  stopAt = performance.now() + seconds * 1000;
  startMetronome();

  statusEl.textContent = `Running: ${signature}/4 @ ${bpm} BPM for ${seconds}s. Origin calibrated; trace resets on every metronome downbeat.`;
}

document.getElementById("startBtn").addEventListener("click", () => { start(); });
</script>
</body>
</html>
