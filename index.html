<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#231F20">
    <title>Bonanza</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Keep every AudioContext the page creates. Unity's WebGL audio makes its own, and the bridge
      // (Plugins/BonanzaBrowser.jslib) needs it for outputLatency and for resume() after the OS suspends
      // it. This must run before the loader, hence here. The prototype is shared, so `instanceof` holds.
      (function () {
        var list = window.__bonanzaAudioCtxs = [];
        ['AudioContext', 'webkitAudioContext'].forEach(function (name) {
          var Orig = window[name];
          if (!Orig) return;
          var Wrapped = function () {
            var c = new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))();
            list.push(c);
            return c;
          };
          Wrapped.prototype = Orig.prototype;
          try { window[name] = Wrapped; } catch (e) { /* read-only: the jslib then relies on Unity's own handle */ }
        });
      })();
    </script>
    <!-- Camera conducting (Swing Kings): a few KB. The model and wasm under mediapipe/ load only when it is used. -->
    <script src="bonanza-camera.js"></script>
    <style>
      /* small windows: a one-line keyboard note that hides itself, and a fullscreen button tucked into the bottom corner
         (the top corners hold SCORE and ACCURACY) */
      @media (max-height: 520px), (max-width: 700px) {
        #unity-mobile-notice { padding: calc(3px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 3px calc(8px + env(safe-area-inset-left)); font-size: 11px; line-height: 1.2; gap: 8px; transition: opacity .4s }
        #unity-mobile-notice button { min-width: 36px; min-height: 22px; font-size: 11px; border-radius: 5px }
        #unity-fullscreen-button { top: auto !important; bottom: calc(4px + env(safe-area-inset-bottom)) !important; right: calc(4px + env(safe-area-inset-right)) !important; width: 24px !important; height: 24px !important; background-size: contain !important }
      }
    </style>
  </head>
  <body>
    <div id="unity-mobile-notice" role="note" hidden>
      <span>Bonanza plays best with a keyboard. Touch works too.</span>
      <button id="unity-mobile-notice-close" type="button" aria-label="Dismiss">OK</button>
    </div>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="Fullscreen" role="button" aria-label="Fullscreen"></div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Pages.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Pages.data.unityweb",
        frameworkUrl: buildUrl + "/Pages.framework.js.unityweb",
        codeUrl: buildUrl + "/Pages.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "Bonanza",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // The canvas fills the window (CSS, see TemplateData/style.css). The render target follows its size times
      // devicePixelRatio; cap that so a hi-DPI screen on an integrated GPU does not draw 4x the pixels.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

      // Phones and small touch screens: the game is built around a keyboard. Say so, once, dismissibly.
      (function () {
        var coarse = false;
        try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) { /* ignore */ }
        var small = Math.min(window.innerWidth, window.innerHeight) < 500;
        var dismissed = false;
        try { dismissed = sessionStorage.getItem('bonanza-notice') === '1'; } catch (e) { /* storage blocked */ }
        if ((coarse || small) && !dismissed) {
          var n = document.getElementById('unity-mobile-notice');
          n.hidden = false;
          // the notice sits above the canvas, not over the menu: the canvas starts below it
          var fit = function () {
            var h = n.hidden ? 0 : n.offsetHeight;
            canvas.style.top = h + 'px'; canvas.style.height = 'calc(100% - ' + h + 'px)';
          };
          fit(); window.addEventListener('resize', fit);
          var close = function () {
            if (n.hidden) return;
            n.hidden = true; fit();
            try { sessionStorage.setItem('bonanza-notice', '1'); } catch (e) { /* ignore */ }
          };
          document.getElementById('unity-mobile-notice-close').onclick = close;
          setTimeout(close, 8000);   // it says its piece, then gets out of the way
        }
      })();


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
